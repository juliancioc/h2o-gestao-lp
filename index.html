<!doctype html>
<html lang="pt-BR">

<head>
  <!-- Medição: o container do Google Tag Manager é injetado em
       src/lib/analytics.ts, a partir de VITE_GTM_ID.
       O GA4 (G-L3Q05DPTYV) saiu daqui de propósito: ele agora é uma TAG dentro
       do container. Mantê-lo também como gtag.js faria cada pageview e cada
       evento contarem duas vezes.
       ⚠️ Enquanto a tag do GA4 não existir no container, a LP não manda nada
       para o Analytics. -->
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>H2O Gestão - Sistema ERP para Distribuidoras de Água</title>
  <meta name="description"
    content="O ERP completo para distribuidoras de água. Gerencie pedidos, estoque e financeiro em uma única plataforma." />
  <meta name="keywords"
    content="ERP água, distribuidora de água, sistema gestão água, software distribuidora, h2oGestão" />
  <meta name="author" content="h2oGestão" />
  <!-- Canonical, title, description e Open Graph são reescritos por rota no build,
       pelo scripts/prerender.mjs. Os valores abaixo são os da home. -->
  <link rel="canonical" href="https://h2ogestao.com.br/" />

  <meta property="og:title" content="h2oGestão - Sistema ERP para Distribuidoras de Água" />
  <meta property="og:description" content="Gerencie pedidos, estoque e financeiro em uma única plataforma." />
  <meta property="og:url" content="https://h2ogestao.com.br/" />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="H2O Gestão" />
  <meta property="og:locale" content="pt_BR" />
  <meta property="og:image" content="https://h2ogestao.com.br/og-image.jpg" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt"
    content="H2O Gestão: o sistema da sua distribuidora, num lugar só. Vendas, estoque, fiado, entregas e caixa." />

  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:site" content="@h2oGestao" />
  <meta name="twitter:image" content="https://h2ogestao.com.br/og-image.jpg" />

  <meta name="robots" content="index, follow" />
  <link rel="icon" type="image/x-icon" href="/favicon.png" />
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
